  <style>
    /* ── Tokens — one accent, neutrals exempt ── */
    :root{
      --accent:#c9185b;       /* the single brand accent */
      --ink:#222426;          /* primary text */
      --muted:#6b7280;        /* secondary text / dates */
      --rule:#e6e6e6;         /* hairline separators */
      --paper:#ffffff;
      --chip:#f4f4f5;         /* neutral chip fill */
      --maxw:820px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    body{
      font-family:'Poppins',system-ui,sans-serif;
      color:var(--ink);
      background:#fafafa;
      line-height:1.6;
      font-size:15px;
    }

    /* ── Scroll progress (screen only) ── */
    .progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .08s linear}

    /* ── Sticky top bar (screen only) ── */
    .topbar{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.9);backdrop-filter:saturate(180%) blur(8px);-webkit-backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--rule)}
    .topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:9px 32px}
    .brand{color:var(--accent);text-decoration:none;font-weight:600;font-size:.95rem;white-space:nowrap}
    .brand:hover{opacity:.7}
    .secnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
    .secnav::-webkit-scrollbar{display:none}
    .secnav a{font-size:.8rem;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;white-space:nowrap;transition:color .15s,background .15s}
    .secnav a:hover{color:var(--ink);background:var(--chip)}
    .secnav a.active{color:var(--accent);font-weight:600}
    .topbar-actions{display:flex;align-items:center;gap:10px;white-space:nowrap}
    .updated{color:var(--muted);font-size:.8rem}
    .btn{
      font-family:inherit;font-size:.85rem;font-weight:600;
      color:#fff;background:var(--accent);
      border:none;border-radius:8px;
      padding:8px 16px;cursor:pointer;
      transition:opacity .15s;
    }
    .btn:hover{opacity:.85}

    /* ── Sheet ── */
    .sheet{
      max-width:var(--maxw);
      margin:0 auto 60px;
      background:var(--paper);
      border:1px solid var(--rule);
      padding:56px 64px;
    }

    /* ── Masthead ── */
    .masthead{position:relative;border-bottom:2px solid var(--accent);padding-bottom:20px;margin-bottom:28px}
    .masthead .stamp{position:absolute;top:2px;right:0;color:var(--muted);font-size:.76rem}
    .masthead h1{
      font-size:2.5rem;font-weight:700;letter-spacing:.04em;
      color:var(--ink);line-height:1.1;
    }
    .masthead .role{
      color:var(--accent);font-weight:600;font-size:1.05rem;
      letter-spacing:.16em;text-transform:uppercase;margin-top:6px;
    }
    .masthead .tagline{color:var(--muted);margin-top:8px;font-size:.95rem}
    .contact{
      display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;
      font-size:.85rem;
    }
    .contact a,.contact span{color:var(--muted);text-decoration:none}
    .contact a:hover{color:var(--accent)}

    /* ── Sections ── */
    section{margin-top:30px;scroll-margin-top:66px}
    h2{
      font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      color:var(--accent);
      padding-bottom:6px;border-bottom:1px solid var(--rule);
      margin-bottom:16px;
    }
    .profile p{margin-bottom:10px}
    .profile p:last-child{margin-bottom:0}

    /* ── Entry (experience / now) ── */
    .entry{margin-bottom:22px;break-inside:avoid}
    .entry:last-child{margin-bottom:0}
    .entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
    .entry-title{font-weight:600;font-size:1.02rem}
    .entry-org{color:var(--muted);font-size:.9rem}
    .entry-dates{color:var(--muted);font-size:.82rem;white-space:nowrap;font-weight:500}
    .entry-summary{margin-top:6px}
    .entry ul{margin:8px 0 0 0;padding-left:1.1em;list-style:none}
    .entry ul li{position:relative;padding-left:14px;margin-bottom:3px}
    .entry ul li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;background:var(--accent);border-radius:50%}

    /* ── Tags ── */
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .tag{
      font-size:.74rem;color:var(--muted);
      background:var(--chip);border:1px solid var(--rule);
      border-radius:999px;padding:2px 10px;
    }

    /* ── Skills ── */
    .skill-group{margin-bottom:12px}
    .skill-group h3{font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px}
    .skill-group .items{display:flex;flex-wrap:wrap;gap:6px}

    /* ── Speaking ── */
    .talk{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--rule)}
    .talk:last-child{border-bottom:none}
    .talk .meta{min-width:0}
    .talk .title{font-weight:500}
    .talk .event{color:var(--muted);font-size:.85rem}
    .talk .date{color:var(--muted);font-size:.82rem;white-space:nowrap}
    .talk-label{display:inline-block;font-size:.64rem;font-weight:600;color:var(--accent);background:#fbeaf0;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px;letter-spacing:.02em}

    /* ── Two-up footer sections ── */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px}
    .pill-list{display:flex;flex-wrap:wrap;gap:6px}
    .note{color:var(--muted);font-size:.85rem;font-style:italic;margin-top:10px}

    /* ── Website-feel touches (screen only) ── */
    .tag{transition:color .15s,border-color .15s,background .15s}
    .tag:hover{color:var(--ink);border-color:var(--accent)}
    .contact a{transition:color .15s}
    .talk .title{transition:color .15s}
    .talk:hover .title{color:var(--accent)}
    .now .entry{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:12px;transition:border-color .18s}
    .now .entry:last-child{margin-bottom:0}
    html.js .now .entry:hover{border-color:var(--accent)}

    /* ── Scroll reveal (only when JS runs; print & reduced-motion opt out) ── */
    html.js .reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
    html.js .reveal.in{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){html.js .reveal{opacity:1;transform:none;transition:none}}

    @media(max-width:680px){
      .sheet{padding:32px 22px}
      .masthead h1{font-size:2rem}
      .grid2{grid-template-columns:1fr;gap:20px}
      .topbar-inner{padding:9px 16px;gap:10px}
    }

    /* Hide the section nav before it gets tight enough to clip a label */
    @media(max-width:760px){ .secnav{display:none} }

    /* ── Print / PDF ── */
    @media print{
      body{background:#fff;font-size:11.5px}
      .topbar,.progress{display:none}
      .sheet{border:none;max-width:none;margin:0;padding:0 6mm}
      h2{break-after:avoid}
      .entry,.talk,.skill-group{break-inside:avoid}
      .now .entry{border:none;border-radius:0;padding:0;margin-bottom:16px}
      .reveal{opacity:1 !important;transform:none !important}
      a{color:inherit;text-decoration:none}
      @page{margin:14mm}
    }
  </style>
</head>

  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function contactRow(c){
      const parts = [];
      if(c.location) parts.push(`<span>${esc(c.location)}</span>`);
      if(c.email)    parts.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
      if(c.website)  parts.push(`<a href="${esc(c.website)}" target="_blank" rel="noopener">Website</a>`);
      if(c.linkedin) parts.push(`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
      if(c.youtube)  parts.push(`<a href="${esc(c.youtube)}" target="_blank" rel="noopener">YouTube</a>`);
      if(c.github)   parts.push(`<a href="${esc(c.github)}" target="_blank" rel="noopener">GitHub</a>`);
      if(c.bluesky)  parts.push(`<a href="${esc(c.bluesky)}" target="_blank" rel="noopener">Bluesky</a>`);
      return `<div class="contact">${parts.join('')}</div>`;
    }

    const tags = arr => arr && arr.length
      ? `<div class="tags">${arr.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';

    function nowSection(items){
      if(!items || !items.length) return '';
      return `<section class="now"><h2>Now / Building</h2>${items.map(p=>`
        <div class="entry">
          <div class="entry-head"><span class="entry-title">${esc(p.name)}</span></div>
          <p class="entry-summary">${esc(p.blurb)}</p>
          ${tags(p.tags)}
        </div>`).join('')}</section>`;
    }

    function experienceSection(items, note){
      if(!items || !items.length) return '';
      const body = items.map(e=>`
        <div class="entry">
          <div class="entry-head">
            <span class="entry-title">${esc(e.role)} <span class="entry-org">· ${esc(e.org)}${e.location?', '+esc(e.location):''}</span></span>
            <span class="entry-dates">${esc(e.start)} – ${esc(e.end)}</span>
          </div>
          ${e.summary?`<p class="entry-summary">${esc(e.summary)}</p>`:''}
          ${e.bullets && e.bullets.length?`<ul>${e.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}
        </div>`).join('');
      return `<section><h2>Experience</h2>${body}${note?`<p class="note">${esc(note)}</p>`:''}</section>`;
    }

    function skillsSection(groups){
      if(!groups || !groups.length) return '';
      return `<section><h2>Skills</h2>${groups.map(g=>`
        <div class="skill-group">
          <h3>${esc(g.group)}</h3>
          <div class="items">${g.items.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>
        </div>`).join('')}</section>`;
    }

    function speakingSection(items){
      if(!items || !items.length) return '';
      return `<section><h2>Speaking</h2>${items.map(t=>`
        <div class="talk">
          <div class="meta"><div class="title">${esc(t.talk)}${t.label?`<span class="talk-label">${esc(t.label)}</span>`:''}</div><div class="event">${esc(t.event)}</div></div>
          <div class="date">${esc(t.date)}</div>
        </div>`).join('')}</section>`;
    }

    function communitySection(items){
      if(!items || !items.length) return '';
      return `<section><h2>Community &amp; Content</h2>${items.map(c=>`
        <div class="entry">
          <div class="entry-head"><span class="entry-title">${esc(c.name)}</span></div>
          ${c.blurb?`<p class="entry-summary">${esc(c.blurb)}</p>`:''}
        </div>`).join('')}</section>`;
    }

    function footerSections(cv){
      const edu = (cv.education||[]).map(e=>`
        <div class="entry">
          <div class="entry-head">
            <span class="entry-title">${esc(e.qualification)}</span>
            <span class="entry-dates">${esc(e.period)}</span>
          </div>
          <div class="entry-org">${esc(e.institution)}</div>
        </div>`).join('');
      const about = (cv.about||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join('');
      const interests = (cv.interests||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join('');
      return `
        <div class="grid2">
          <section style="margin-top:0"><h2>Education</h2>${edu}</section>
          <section style="margin-top:0"><h2>About</h2><div class="pill-list">${about}</div>
            ${interests?`<h3 style="font-size:.82rem;font-weight:600;margin:14px 0 6px">Also</h3><div class="pill-list">${interests}</div>`:''}
          </section>
        </div>`;
    }

    function render(cv){
      document.title = `${cv.name}, CV`;
      const html = `
        <header class="masthead">
          ${cv.updated?`<div class="stamp">Updated ${esc(cv.updated)}</div>`:''}
          <h1>${esc(cv.name)}</h1>
          <div class="role">${esc(cv.title)}</div>
          ${cv.tagline?`<div class="tagline">${esc(cv.tagline)}</div>`:''}
          ${contactRow(cv.contact||{})}
        </header>
        ${cv.profile&&cv.profile.length?`<section class="profile"><h2>Profile</h2>${cv.profile.map(p=>`<p>${esc(p)}</p>`).join('')}</section>`:''}
        ${experienceSection(cv.experience, cv.experienceNote)}
        ${nowSection(cv.now)}
        ${skillsSection(cv.skills)}
        ${speakingSection(cv.speaking)}
        ${communitySection(cv.community)}
        ${footerSections(cv)}
      `;
      const el = document.getElementById('cv');
      el.innerHTML = html;
      el.setAttribute('aria-busy','false');
    }

    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const NAV_LABELS = { 'now-building':'Building', 'community-content':'Community', 'education-about':'Education' };

    function enhance(){
      const cvEl = document.getElementById('cv');
      const sections = [...cvEl.querySelectorAll(':scope > section')];
      const nav = document.getElementById('secnav');

      // Build the section nav from whatever sections were rendered
      sections.forEach(s=>{
        const h = s.querySelector('h2'); if(!h) return;
        const id = slug(h.textContent);
        s.id = id;
        const a = document.createElement('a');
        a.href = '#'+id;
        a.textContent = NAV_LABELS[id] || h.textContent.trim();
        a.dataset.target = id;
        nav.appendChild(a);
      });
      const links = [...nav.querySelectorAll('a')];

      // Scroll-reveal (sections + footer block)
      const revealEls = [...sections];
      const footer = cvEl.querySelector('.grid2'); if(footer) revealEls.push(footer);
      revealEls.forEach(el=>el.classList.add('reveal'));
      // Hard reveal: drop the .reveal hidden state entirely so visibility never
      // depends on a transition actually running (belt-and-braces for odd envs).
      const hardReveal = ()=>revealEls.forEach(el=>{ el.classList.add('in'); el.classList.remove('reveal'); });

      try{
        if('IntersectionObserver' in window){
          const ro = new IntersectionObserver((entries)=>{
            entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); ro.unobserve(e.target); } });
          }, { rootMargin:'0px 0px -8% 0px', threshold:0.05 });
          revealEls.forEach(el=>ro.observe(el));

          // Scroll-spy: highlight the section crossing the middle band
          const so = new IntersectionObserver((entries)=>{
            entries.forEach(e=>{ if(e.isIntersecting){
              links.forEach(l=>l.classList.toggle('active', l.dataset.target===e.target.id));
            }});
          }, { rootMargin:'-45% 0px -50% 0px', threshold:0 });
          sections.forEach(s=>so.observe(s));
        } else {
          hardReveal();
        }
      }catch(e){ hardReveal(); }

      // Fail-safe: if nothing has revealed shortly after load, force everything visible
      setTimeout(()=>{ if(!cvEl.querySelector('.reveal.in')) hardReveal(); }, 1000);

      // Scroll-progress bar
      const prog = document.getElementById('progress');
      const onScroll = ()=>{
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        prog.style.width = (max>0 ? (h.scrollTop/max)*100 : 0) + '%';
      };
      window.addEventListener('scroll', onScroll, { passive:true });
      onScroll();
    }

    try{
      document.documentElement.classList.add('js');
      const data = JSON.parse(document.getElementById('cv-data').textContent);
      render(data);
      enhance();
    }catch(err){
      document.getElementById('cv').innerHTML =
        `<p style="color:var(--muted)">Couldn't read the embedded CV data (${esc(err.message)}).</p>`;
    }
  </script>
</body>
</html>
